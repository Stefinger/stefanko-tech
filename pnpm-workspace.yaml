# Build-script approvals for pnpm 11.
#
# Local QA requires Puppeteer and the Apple Silicon FFmpeg binary.
# Production does not require Sharp or unrs-resolver build scripts.
# Linux FFmpeg binaries are explicitly denied because Railway does not run
# the local video-encoding QA during the website build.

allowBuilds:
  "@ffmpeg-installer/darwin-arm64": true
  "@ffmpeg-installer/linux-x64": false
  "@ffmpeg-installer/linux-arm64": false
  puppeteer: true
  sharp: false
  unrs-resolver: false
